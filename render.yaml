databases:
  - name: circa-db
    databaseName: circa
    user: circa
    plan: free
services:
  - type: web
    name: circa-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - {key: ENV, value: production}
      - {key: TRUST_PROXY, value: "true"}
      - {key: SEED_ON_START, value: "true"}
      - {key: DEMO_MODE, value: "false"}
      - {key: DATABASE_URL, fromDatabase: {name: circa-db, property: connectionString}}
      - {key: JWT_SECRET, generateValue: true}
      - {key: SERIAL_SECRET, generateValue: true}
      - {key: ADMIN_EMAIL, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
